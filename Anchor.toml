[toolchain]
anchor_version = "0.31.1"

[features]
resolution = true
skip-lint = false

# Program ids are placeholders until first deploy. `anchor keys sync` rewrites
# both these entries and the `declare_id!` in each program from the generated
# keypairs in target/deploy — do not hand-edit one without the other.
[programs.localnet]
strata_core = "Strata111111111111111111111111111111111111"
strata_packs = "StrataPacks11111111111111111111111111111111"
strata_market = "StrataMarket1111111111111111111111111111111"

[programs.devnet]
strata_core = "Strata111111111111111111111111111111111111"
strata_packs = "StrataPacks11111111111111111111111111111111"
strata_market = "StrataMarket1111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

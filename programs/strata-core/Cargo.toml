[package]
name = "strata-core"
version = "0.1.0"
description = "STRATA core program: config, claims, mining settlement and city state"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "strata_core"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
